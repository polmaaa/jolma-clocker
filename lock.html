<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jolma CLocker - Browser Security Guard</title>
  <link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <!-- UPDATE NOTIFICATION BANNER (tampil otomatis saat ada versi baru) -->
  <div id="update-toast" class="update-toast">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="update-toast-icon">
      <path d="M21 2v6h-6"></path>
      <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
      <path d="M3 22v-6h6"></path>
      <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
    </svg>
    <div class="update-toast-text">
      <span class="update-toast-title">Update tersedia!</span>
      <span id="update-toast-version" class="update-toast-sub">Versi baru siap diunduh</span>
    </div>
    <a id="update-toast-link" href="https://github.com/polmaaa/polock" target="_blank" class="update-toast-btn">Unduh</a>
    <button id="update-toast-close" class="update-toast-close" title="Tutup">✕</button>
  </div>

  <!-- Ambient Pastel Gradient Background -->

  <div class="bg-gradient">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Unlocked Top Bar -->
  <div id="unlocked-top-bar" class="top-bar">
    <!-- Dropdown Menu -->
    <div class="menu-wrapper" id="menu-wrapper">
      <button id="menu-btn" class="btn-menu" title="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="menu-btn-icon">
          <line x1="4" y1="8" x2="20" y2="8"></line>
          <line x1="4" y1="16" x2="20" y2="16"></line>
        </svg>
        <span class="menu-btn-text">Menu</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="chevron-down">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <div id="menu-dropdown" class="menu-dropdown">
        <div class="menu-dropdown-header">
          <span class="menu-dropdown-label">Pengaturan</span>
        </div>

        <button id="menu-lock-btn" class="menu-item menu-item-lock">
          <span class="menu-item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="menu-item-icon">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <span class="menu-item-label">Kunci Browser</span>
        </button>

        <button id="menu-username-btn" class="menu-item menu-item-user">
          <span class="menu-item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="menu-item-icon">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span class="menu-item-label">Ubah Nama</span>
        </button>

        <div class="menu-divider"></div>

        <button id="menu-changepw-btn" class="menu-item menu-item-pw">
          <span class="menu-item-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="menu-item-icon">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </span>
          <span class="menu-item-label">Ubah Kata Sandi</span>
        </button>

        <div class="menu-footer">
          <span id="menu-footer-version">Jolma CLocker v0.2.1 • by Polma Sihotang</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Ubah Nama Pengguna -->
  <div id="username-modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Ubah Nama Pengguna</h3>
        <button id="username-modal-close-btn" class="modal-close" title="Tutup">✕</button>
      </div>
      <form id="modal-username-form">
        <input type="text" id="modal-username-input" placeholder="Masukkan nama Anda..." required autocomplete="off" maxlength="32">
        <div id="username-modal-feedback" class="modal-feedback"></div>
        <button type="submit" class="btn-modal-submit">Simpan Nama</button>
      </form>
    </div>
  </div>

  <!-- Modal: Ubah Kata Sandi -->
  <div id="changepw-modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Ubah Kata Sandi</h3>
        <button id="modal-close-btn" class="modal-close" title="Tutup">✕</button>
      </div>
      <form id="modal-changepw-form">
        <input type="password" id="modal-old-password" placeholder="Kata sandi lama..." required autocomplete="off">
        <input type="password" id="modal-new-password" placeholder="Kata sandi baru..." required autocomplete="off">
        <input type="password" id="modal-confirm-password" placeholder="Konfirmasi kata sandi baru..." required autocomplete="off">
        <div id="modal-feedback" class="modal-feedback"></div>
        <button type="submit" class="btn-modal-submit">Simpan Kata Sandi</button>
      </form>
    </div>
  </div>

  <div class="container">
    <!-- Dynamic Greeting Text above Clock -->
    <div class="greeting-container">
      <h2 id="greeting-text">
        <span id="greeting-prefix">Selamat Siang,</span>
        <span id="greeting-name">Polma Sihotang</span>
      </h2>
    </div>

    <!-- Massive Full Screen Clock & Date -->
    <div class="clock-container">
      <div class="clock-wrapper">
        <h1 id="clock">00:00:00</h1>
        <span id="timezone-badge" class="timezone-badge">WIB</span>
      </div>
      <p id="date">Hari, Tanggal Bulan Tahun</p>
    </div>

    <!-- Redesigned Lock Card: Sleek Horizontal Lock Pill (Locked State Only) -->
    <div id="lock-card" class="lock-pill-container">
      <form id="lock-form" class="lock-pill-form">
        <div class="lock-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lock-pill-icon">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <input type="password" id="password-input" placeholder="Masukkan kata sandi..." required autocomplete="off">
        <button type="button" id="toggle-password" title="Tampilkan Kata Sandi">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="eye-icon" id="eye-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <button type="submit" class="btn-pill-submit" title="Buka Kunci">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
      <div id="error-message" class="error-msg">Sandi salah. Silakan coba lagi!</div>
    </div>

    <!-- Simple Search Bar (Unlocked State Only) -->
    <div id="search-section" class="search-container">
      <form id="search-form">
        <div class="search-group">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Cari di Google..." autocomplete="off">
        </div>
      </form>
    </div>
  </div>

  <script src="lock.js"></script>
</body>
</html>
