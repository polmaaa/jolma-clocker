<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jolma CLocker - Browser Security Guard</title>
  <link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">

    <!-- UPDATE BANNER (tampil hanya saat ada update) -->
    <div id="update-banner" class="update-banner">
      <div class="update-banner-left">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="update-icon">
          <path d="M21 2v6h-6"></path>
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
          <path d="M3 22v-6h6"></path>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
        </svg>
        <div class="update-text">
          <span class="update-title">Update tersedia!</span>
          <span id="update-version-label" class="update-subtitle">v0.0.0</span>
        </div>
      </div>
      <a id="update-link" href="#" target="_blank" class="btn-update">Unduh</a>
    </div>

    <!-- HEADER -->
    <div class="header">
      <div class="icon-glow">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="header-icon" id="status-icon">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="header-text">
        <h3>Jolma CLocker</h3>
        <span id="local-version" class="version-label">v0.2.1</span>
      </div>
    </div>

    <!-- Status badge -->
    <div class="status-badge" id="status-badge">
      <span class="dot"></span>
      <span id="status-text">Memeriksa...</span>
    </div>

    <!-- View 1: Locked Actions (enter password in popup) -->
    <div id="locked-actions" class="content-section">
      <form id="popup-lock-form">
        <input type="password" id="popup-password-input" placeholder="Masukkan kata sandi..." required autocomplete="off">
        <div id="popup-error" class="error-text">Sandi salah!</div>
        <button type="submit" class="btn-popup btn-primary">Buka Kunci</button>
      </form>
    </div>

    <!-- View 2: Unlocked Actions (lock button + change password accordion) -->
    <div id="unlocked-actions" class="content-section">
      <p class="info-text">Aktivitas browser Anda normal dan dapat diakses sepenuhnya.</p>
      <button id="popup-lock-btn" class="btn-popup btn-danger">Kunci Sekarang</button>
      
      <!-- Accordion Button for Change Username -->
      <button id="accordion-username-toggle" class="btn-accordion">
        Ubah Nama Pengguna
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon" id="chevron-username-icon">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Accordion Panel for Username (hidden by default) -->
      <div id="accordion-username-panel" class="accordion-panel">
        <form id="change-username-form">
          <input type="text" id="popup-username-input" placeholder="Nama Anda..." required autocomplete="off" maxlength="32">
          <div id="change-username-feedback" class="feedback-text"></div>
          <button type="submit" class="btn-popup btn-secondary">Simpan Nama</button>
        </form>
      </div>

      <!-- Accordion Button for Weather Settings -->
      <button id="accordion-weather-toggle" class="btn-accordion">
        Pengaturan Cuaca
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon" id="chevron-weather-icon">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Accordion Panel for Weather Settings (hidden by default) -->
      <div id="accordion-weather-panel" class="accordion-panel">
        <div class="popup-toggle-row">
          <span class="popup-toggle-label">Lokasi Presisi (GPS Real-time)</span>
          <label class="switch">
            <input type="checkbox" id="popup-gps-toggle">
            <span class="slider round"></span>
          </label>
        </div>
        <div id="popup-weather-preview" class="popup-weather-preview">
          <span id="popup-weather-icon">🌤️</span>
          <span id="popup-weather-info">Memuat cuaca...</span>
        </div>
        <div id="popup-weather-feedback" class="feedback-text"></div>
      </div>

      <!-- Accordion Button for Change Password -->
      <button id="accordion-toggle" class="btn-accordion">
        Ubah Kata Sandi
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon" id="chevron-icon">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Accordion Panel (hidden by default) -->
      <div id="accordion-panel" class="accordion-panel">
        <form id="change-pw-form">
          <input type="password" id="old-password" placeholder="Kata sandi lama..." required autocomplete="off">
          <input type="password" id="new-password" placeholder="Kata sandi baru..." required autocomplete="off">
          <input type="password" id="confirm-password" placeholder="Konfirmasi kata sandi baru..." required autocomplete="off">
          <div id="change-pw-feedback" class="feedback-text"></div>
          <button type="submit" class="btn-popup btn-secondary">Simpan Kata Sandi</button>
        </form>
      </div>
    </div>

    <!-- Footer: versi lokal, tombol cek update, dan credit pengembang -->
    <div class="popup-footer">
      <button id="check-update-btn" class="btn-check-update" title="Periksa update sekarang">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="refresh-icon" id="refresh-icon">
          <path d="M21 2v6h-6"></path>
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
          <path d="M3 22v-6h6"></path>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
        </svg>
        <span id="check-update-label">Periksa Update</span>
      </button>
      <div class="popup-credit">by Polma Sihotang</div>
    </div>

  </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
